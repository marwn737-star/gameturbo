name: Build MRD7
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/mrd7/gfxtool app/src/main/res/drawable app/src/main/res/mipmap-xxxhdpi

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MRD7"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.mrd7.gfxtool"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.mrd7.gfxtool"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="MRD 7"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:startColor="#0F172A"
                  android:centerColor="#312E81"
                  android:endColor="#7C3AED"
                  android:angle="315" />
          </shape>
          EOF

          cat > app/src/main/java/com/mrd7/gfxtool/MainActivity.kt << 'EOF'
          package com.mrd7.gfxtool

          import android.app.Activity
          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ApplicationInfo
          import android.graphics.Color
          import android.os.BatteryManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.widget.ArrayAdapter
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView
          import java.net.InetSocketAddress
          import java.net.Socket
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private lateinit var stats: TextView
              private val handler = Handler(Looper.getMainLooper())
              @Volatile private var ping = "..."

              private val tick = object : Runnable {
                  override fun run() {
                      measurePing()
                      stats.text = buildStats()
                      handler.postDelayed(this, 2000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 96, 32, 32)
                      setBackgroundResource(R.drawable.bg)
                  }
                  val title = TextView(this).apply {
                      text = "MRD 7"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                  }
                  stats = TextView(this).apply {
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setPadding(0, 24, 0, 24)
                  }
                  val list = ListView(this)
                  root.addView(title)
                  root.addView(stats)
                  root.addView(list)
                  setContentView(root)

                  val pm = packageManager
                  val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val all = pm.queryIntentActivities(q, 0)
                  var apps = all.filter {
                      it.activityInfo.applicationInfo.category == ApplicationInfo.CATEGORY_GAME
                  }
                  if (apps.isEmpty()) apps = all
                  val names = apps.map { it.loadLabel(pm).toString() }
                  list.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, names)
                  list.setOnItemClickListener { _, _, i, _ ->
                      pm.getLaunchIntentForPackage(apps[i].activityInfo.packageName)
                          ?.let { startActivity(it) }
                  }
              }

              override fun onResume() { super.onResume(); handler.post(tick) }
              override fun onPause() { super.onPause(); handler.removeCallbacks(tick) }

              private fun measurePing() {
                  thread {
                      val t = System.currentTimeMillis()
                      ping = try {
                          Socket().use { it.connect(InetSocketAddress("8.8.8.8", 53), 1500) }
                          "${System.currentTimeMillis() - t} ms"
                      } catch (e: Exception) { "—" }
                  }
              }

              private fun buildStats(): String {
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mi = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
                  val freeMb = mi.availMem / 1048576
                  val totalMb = mi.totalMem / 1048576
                  val bat = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val level = bat?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val temp = (bat?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10f
                  return "Ping: $ping\nRAM: $freeMb / $totalMb MB\nBattery: $level%  $temp °C"
              }
          }
          EOF

          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            sed -i '/android:icon/d' app/src/main/AndroidManifest.xml
          fi
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MRD7-apk
          path: app/build/outputs/apk/debug/app-debug.apk
